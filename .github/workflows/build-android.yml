name: Build BlockMate Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Android build variant
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
  push:
    branches: [main]

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "22"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: pnpm expo prebuild --clean --platform android

      - name: Build debug APK
        if: ${{ github.event_name == 'push' || inputs.variant == 'debug' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.variant == 'release' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          apk_path="$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$apk_path" ]; then
            echo "No APK was produced" >&2
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "Built $apk_path"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockmate-${{ github.run_number }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
